[project]
name = "jarvis-harness"
version = "0.1.0"
description = "Always-on voice harness that hands work to Claude Code, OpenCode and Hermes Agent."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pipecat-ai[silero,whisper,mlx-whisper,openai,elevenlabs]>=0.0.50",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "loguru>=0.7.2",
    "claude-agent-sdk>=0.2.176",
    "mem0ai>=2.2.1",
    "qdrant-client>=1.12.0",
    "ollama>=0.4.0",
    "websockets>=13.0",
    "sherpa-onnx>=2.0.1",
    "pyobjc-framework-AVFoundation>=11.0",
    "pyobjc-framework-Quartz>=11.0",
]

[project.scripts]
jarvis = "jarvis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[dependency-groups]
dev = ["ruff>=0.8", "mypy>=1.13"]

[tool.ruff]
line-length = 130
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Prompt text: a newline inside it is part of what the model reads, so its lines stay as written.
"src/jarvis/prompts.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src/jarvis"]
ignore_missing_imports = true
