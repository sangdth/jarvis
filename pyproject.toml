[project]
name = "jarvis-harness"
version = "0.1.0"
description = "Always-on voice harness that hands work to Claude Code, OpenCode and Hermes Agent."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "pipecat-ai[silero,whisper,mlx-whisper,openai,elevenlabs,local]>=0.0.50",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "loguru>=0.7.2",
    "claude-agent-sdk>=0.2.176",
    "mem0ai>=2.2.1",
    "qdrant-client>=1.12.0",
    "ollama>=0.4.0",
    "websockets>=13.0",
    "sherpa-onnx>=2.0.1",
    "voiceclean==0.3.6",
]

[project.scripts]
jarvis = "jarvis.main:main"
jarvis-enroll = "jarvis.enroll:main"
jarvis-init = "jarvis.soul:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]
