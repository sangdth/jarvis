[workspace]
resolver = "2"
members = ["apps/tui"]

# One lockfile and one `target/` per checkout: the cockpit, and any Rust crate or native extension
# added later, share compilation caches.

[profile.release]
# The cockpit is the one compiled artifact, built once per edit: LTO and stripped symbols keep it small.
opt-level = 2
lto = "thin"
strip = true
