[project]
name = "jarvis-voice"
version = "0.1.0"
description = "Jarvis's always-on voice harness: Pipecat ear, speech check, executive model and agent watchers."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    # Pinned to the minor release we test: voice_gates.py and latency.py extend Pipecat's private methods, and
    # `uv tool install` from master ignores uv.lock.
    "pipecat-ai[silero,mlx-whisper,openai,elevenlabs]>=1.15,<1.16",
    "jarvis-core",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "loguru>=0.7.2",
    "claude-agent-sdk>=0.2.176",
    "mem0ai>=2.2.1",
    "qdrant-client>=1.12.0",
    "ollama>=0.4.0",
    "websockets>=13.0",
    "sherpa-onnx>=2.0.1",
    "pyobjc-framework-AVFoundation>=11.0",
    "pyobjc-framework-Quartz>=11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_voice"]
