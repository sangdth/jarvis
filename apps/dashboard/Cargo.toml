[package]
name = "jarvis-dashboard"
version = "0.1.0"
edition = "2021"
description = "Fullscreen Ratatui dashboard for Jarvis's brain"
license = "AGPL-3.0-only"

[[bin]]
name = "jarvis-dashboard"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
rusqlite = { version = "0.43", features = ["bundled"] }
serde_json = "1"
similar = "2"
