[package]
name = "jarvis-top"
version = "0.1.0"
edition = "2021"
description = "Fullscreen Ratatui cockpit for Jarvis's brain (Superbrain)"
license = "AGPL-3.0-only"

[[bin]]
name = "jarvis-top"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
rusqlite = { version = "0.43", features = ["bundled"] }
serde_json = "1"
similar = "2"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
