[project]
name = "superbrain"
version = "0.1.0"
description = "Always-on goal and problem reconciler: the brain Jarvis starts with the voice."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10.0",
    "jarvis-core",
    "pydantic-settings>=2.2.0",
    "loguru>=0.7.2",
]

[project.scripts]
superbrain = "superbrain.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/superbrain"]
