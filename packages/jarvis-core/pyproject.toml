[project]
name = "jarvis-core"
version = "0.1.0"
description = "What every Jarvis app shares: the state home, its .env, the brain token and SOUL.md."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = ["pydantic-settings>=2.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_core"]
