# Builds the Connect app (`Jarvis.app`, one Connect button) on every push to master, publishes a `Jarvis Connect.dmg`
# as a workflow artifact, and replaces the asset on the rolling `connect` release so there is a stable public link:
# https://github.com/sangdth/jarvis/releases/download/connect/Jarvis%20Connect.dmg
# Apple Silicon only: apps/connect/build.sh compiles for arm64.
name: connect

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: connect
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: sh apps/connect/build.sh
      # The dmg is what people download; the zip build.sh writes stays local, for the gateway's in-app Update.
      - name: Make the dmg
        run: |
          stage="$RUNNER_TEMP/dmg"
          mkdir -p "$stage"
          cp -R target/connect/Jarvis.app "$stage/"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname 'Jarvis Connect' -srcfolder "$stage" -ov -format UDZO \
            'target/connect/Jarvis Connect.dmg'
      - uses: actions/upload-artifact@v5
        with:
          name: Jarvis Connect
          path: target/connect/Jarvis Connect.dmg
          if-no-files-found: error
      # No version tags yet: one tag, `connect`, whose asset is replaced on every master push. The app says which
      # branch and commit it came from.
      - name: Publish to the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: 'The Mac app with one Connect button. Rebuilt on every push to master; the same tag, a newer `Jarvis Connect.dmg`. Install it without the first-launch block: `curl -fsSL https://github.com/sangdth/jarvis/releases/download/connect/install-connect.sh | sh`. The dmg opens by hand only if you clear quarantine yourself (`xattr -dr com.apple.quarantine /Applications/Jarvis.app`): it is ad-hoc signed, not notarized.'
        run: |
          gh release view connect >/dev/null 2>&1 || gh release create connect --title 'Connect app' --notes "$NOTES"
          gh release edit connect --notes "$NOTES"
          gh release upload connect 'target/connect/Jarvis Connect.dmg' apps/connect/install-connect.sh --clobber
