name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # One Python for the whole repo (`mise.toml`); the runner's own 3.15 has no `onnxruntime` wheel.
  UV_PYTHON: "3.12"

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: uv sync --frozen
      - run: uv run ruff check src apps packages tests scripts
      - run: uv run mypy
      - run: uv run pytest -q
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --quiet
      - run: sh apps/connect/build.sh
